name: Release

# Push a tag like v0.2.0 to build packages and publish a GitHub Release.
# App version in etools/__init__.py must match the tag (without the leading v).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          APP_VER="$(python3 -c "import re,pathlib; t=pathlib.Path('etools/__init__.py').read_text(); print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', t).group(1))")"
          echo "tag=$TAG app=$APP_VER"
          if [ "$VER" != "$APP_VER" ]; then
            echo "::error::Tag $TAG does not match etools/__init__.py version $APP_VER"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libusb-1.0-0 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libegl1 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0
      - name: Install and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pytest -q

  build-windows:
    name: Build Windows
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Package
        shell: cmd
        run: packaging\package_windows.bat --clean
      - name: Collect artifacts
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist/upload | Out-Null
          Copy-Item "dist/release/ETools-portable-$ver-win64.zip" dist/upload/ -ErrorAction SilentlyContinue
          Copy-Item "dist/release/ETools-setup-$ver-win64.exe" dist/upload/ -ErrorAction SilentlyContinue
          Get-ChildItem dist/upload | Format-Table Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: dist/upload/*
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libusb-1.0-0 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libegl1 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0 \
            dpkg-dev file
      - name: Install appimagetool
        run: |
          mkdir -p tools
          curl -fsSL -o tools/appimagetool-x86_64.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x tools/appimagetool-x86_64.AppImage
          # Extract the full AppDir (no FUSE in CI). AppRun must stay next to
          # usr/bin — moving AppRun alone breaks its relative exec path.
          rm -rf tools/squashfs-root squashfs-root
          ./tools/appimagetool-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/appimagetool
          mv squashfs-root tools/squashfs-root
          cat > tools/appimagetool <<'WRAP'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$HERE/squashfs-root/AppRun" "$@"
          WRAP
          chmod +x tools/appimagetool
          tools/appimagetool --version
      - name: Package
        run: |
          chmod +x packaging/package_linux.sh
          bash packaging/package_linux.sh --clean
      - name: Collect artifacts
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          mkdir -p dist/upload
          cp -f "dist/release/ETools-portable-${VER}-linux-x86_64.tar.gz" dist/upload/
          cp -f "dist/release/ETools-${VER}-amd64.deb" dist/upload/
          cp -f "dist/release/ETools-${VER}-x86_64.AppImage" dist/upload/
          ls -lh dist/upload
          test -f "dist/upload/ETools-${VER}-x86_64.AppImage"
          test -f "dist/upload/ETools-${VER}-amd64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: dist/upload/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist/assets
          merge-multiple: true
      - name: Build release notes
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          NOTES_FILE=dist/release-notes.md
          mkdir -p dist

          # Body from CHANGELOG.md section "## [VER]" (date optional); fallback if missing.
          {
            echo "## ETools v${VER}"
            echo
            CHANGELOG_SECTION="$(python3 -m etools.release_notes "$VER" --changelog CHANGELOG.md || true)"
            if [[ -n "${CHANGELOG_SECTION}" ]]; then
              printf '%s\n\n' "$CHANGELOG_SECTION"
            else
              echo "See repository commits for changes in this version."
              echo
            fi

            echo "## Downloads"
            echo
            echo "| Asset | Platform |"
            echo "|-------|----------|"
            (
              cd dist/assets
              for f in *; do
                case "$f" in
                  *win64*|*setup*.exe|*portable*-win*) plat="Windows" ;;
                  *.AppImage|*linux*.tar.gz|*amd64.deb) plat="Linux" ;;
                  *) plat="—" ;;
                esac
                echo "| \`$f\` | $plat |"
              done
            )
            echo
            echo "## Checksums (SHA-256)"
            echo
            echo '```'
            (cd dist/assets && sha256sum *)
            echo '```'
          } > "$NOTES_FILE"

          echo "----- release notes -----"
          cat "$NOTES_FILE"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v${VER}" \
            --title "ETools v${VER}" \
            --notes-file dist/release-notes.md \
            dist/assets/* \
            --verify-tag
